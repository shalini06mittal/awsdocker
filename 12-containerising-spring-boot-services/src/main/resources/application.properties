spring.application.name=mission-service

# spring.datasource.url=jdbc:postgresql://postgres:5432/mission
# spring.datasource.username=postgres
# spring.datasource.password=mission

mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

jwt.shared-secret=mission-control-shared-secret-key-32-bytes-minimum

spring.datasource.url=jdbc:postgresql://postgres:5432/paysprint
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver
