services:

  springboot:
    build:
      context: ./12-containerising-spring-boot-services
      dockerfile: Dockerfile
    container_name: paysprint-springboot
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-paysprint}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paysprint}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - paysprint

  nestjs:
    build:
      context: ./15-mission-build-openapi-docs-and-replacing-the-sprint7-stub
      dockerfile: Dockerfile
    container_name: paysprint-nestjs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    networks:
      - paysprint

volumes:
  postgres_data:

networks:
  paysprint:
    driver: bridge
